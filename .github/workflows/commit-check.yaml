name: commit-checks
on: push
permissions:
  contents: read
jobs:
  setup-and-run-checks:
    name: Setup and run checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Repo checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check --output-format github .

      - name: Format
        run: uv run --locked ruff format --check .

      - name: Pytest
        run: uv run --locked pytest
