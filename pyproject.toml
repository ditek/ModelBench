[project]
name = "modelbench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Diaa J", email = "ditek@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
