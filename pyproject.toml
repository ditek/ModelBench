[project]
name = "modelbench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Diaa J", email = "ditek@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
modelbench = "modelbench.cli:main"

[project.optional-dependencies]
bench = [
    "numpy>=2.2.6",
    "onnx>=1.23.2",
    "onnxruntime>=1.23.2",
    "onnxscript>=0.7.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.ruff.format]
quote-style = "single"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
